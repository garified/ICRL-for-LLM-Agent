# Mathematical Olympiads Benchmark Configuration
# Usage: python run_olympiads.py benchmarks/olympiads/config.yaml

# Dataset configuration
dataset_name: "AI-MO/olympiads-ref"
num_problems: 50  # -1 for all problems, or specify a smaller number

# ICRL parameters
num_initial_attempts: 2
num_rounds: 50
max_completion_tokens: 2048
context_size: 262144
parallelization_degree: 100
max_attempts_in_context: null  # null means no limit
max_attempt_length: 2048  # Olympiad solutions can be quite long

# Model configuration (for generation)
model_name: "qwen3-next"
model_encoder: "Qwen/Qwen3-Next-80B-A3B-Instruct"
api_base: "http://0.0.0.0:8000/v1"
# api_key: "your-api-key-here"  # Or set OPENAI_API_KEY environment variable
temperature: 1.0

# Judge configuration (for scoring)
judge_model_name: "qwen3-next"
judge_api_base: "http://0.0.0.0:8000/v1"
judge_temperature: 0.0  # Use 0 for consistent scoring

# Output configuration
base_output_dir: "ICL/olympiads/"
postfix: ""  # Optional postfix for output directory name
debug_run: false  # Set to true for quick testing (2 problems, 3 rounds)

