# Example configuration for Mathador ICRL benchmark

# Dataset configuration
dataset_path: "Mathador/mathador-10000.jsonl"
num_problems: 100  # Use -1 for all problems
num_shots: 2  # Number of few-shot examples

# ICRL parameters
num_initial_attempts: 2
num_rounds: 50
max_completion_tokens: 4096
context_size: 262144
parallelization_degree: 100
max_attempts_in_context: null  # null means no limit
max_attempt_length: 1024

# Model configuration
# model_name: "openai/gpt-oss-20b"
model_name: "qwen3-next"
model_encoder: "Qwen/Qwen3-Next-80B-A3B-Instruct"
# api_base: "https://api.openai.com/v1"
# api_base: "https://openrouter.ai/api/v1"
api_base: "http://0.0.0.0:8000/v1"
# api_key: "your-api-key-here"  # Or set OPENAI_API_KEY environment variable
temperature: 1.0

# Novelty reward (toggle with novelty_reward: true)
novelty_reward: false
novelty_weight: 0.3
novelty_model: "Qwen/Qwen3-0.6B"
novelty_device: "cuda"

# Output
base_output_dir: "ICL/mathador/"
postfix: ""  # Optional postfix for the run name (e.g., "experiment1")
debug_run: false

# Usage:
# python run_mathador.py benchmarks/mathador/config.yaml
# Output will be saved in: ICL/mathador/YYYYMMDD_HHMM_xxx/

# With custom postfix:
# python run_mathador.py benchmarks/mathador/config.yaml postfix=experiment1
# Output will be saved in: ICL/mathador/YYYYMMDD_HHMM_xxx_experiment1/

# To run in debug mode (quick test):
# python run_mathador.py debug_run=true

# To use config file and override parameters:
# python run_mathador.py benchmarks/mathador/config.yaml num_problems=5 num_rounds=10

